<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dewey — DewLab</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Nunito:wght@400;600;700&family=Finger+Paint&display=swap" rel="stylesheet">
<link rel="stylesheet" href="brand.css">
<style>
body{margin:0;background:var(--beige);color:var(--body);font-family:var(--sans);padding:34px}
h1{font-family:var(--display);color:var(--blue);font-size:34px;margin:0 0 4px}
h2{font-family:var(--display);color:var(--ink);font-size:19px;margin:34px 0 14px}
.sub{color:var(--tan);font-weight:700;margin-bottom:8px}
.row{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-end}
figure{margin:0;text-align:center;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 12px 10px}
figcaption{font-size:12px;color:var(--muted);font-weight:700;margin-top:6px;text-transform:uppercase;letter-spacing:.08em}
.swatches{display:flex;gap:12px;flex-wrap:wrap}
.sw{width:120px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.sw i{display:block;height:60px}
.sw span{display:block;font-size:11.5px;padding:7px 9px;font-weight:700;color:var(--ink)}
.sw small{display:block;padding:0 9px 8px;font-size:11px;color:var(--muted);font-weight:400}
</style></head><body>
<h1>Dewey the Dew Drop</h1>
<p class="sub">Curious. Kind. Always ready to learn and explore.</p>

<h2>Expressions</h2>
<div class="row" id="ex"></div>

<h2>Speaking</h2>
<div id="say"></div>

<h2>Avatar size</h2>
<div class="row" id="sm"></div>

<h2>DHCG palette</h2>
<div class="swatches" id="pal"></div>

<script src="dewey.js"></script>
<script>
document.getElementById('ex').innerHTML = Dewey.expressions.map(function(e){
  return '<figure>'+Dewey.html(e,116)+'<figcaption>'+e+'</figcaption></figure>'; }).join('');
document.getElementById('say').innerHTML =
  Dewey.say("Hi! I'm Dewey. Ready to find out what a plant needs to grow?", 'happy', 80);
document.getElementById('sm').innerHTML = Dewey.expressions.map(function(e){
  return '<figure>'+Dewey.html(e,46)+'<figcaption>'+e+'</figcaption></figure>'; }).join('');
var pal=[['--blue','#0071BC','Blue · headings'],['--tan','#C27A2C','Tan · subheads'],
         ['--green','#639245','Green · leaf'],['--yellow','#E7E1A2','Yellow · highlight'],
         ['--beige','#F3F0EC','Beige · background'],['--red','#E3612B','Red · accent ⚠']];
document.getElementById('pal').innerHTML = pal.map(function(p){
  return '<div class="sw"><i style="background:'+p[1]+'"></i><span>'+p[1]+'</span><small>'+p[2]+'</small></div>'; }).join('');
</script></body></html>
